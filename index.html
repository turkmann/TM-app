<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080A09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TM">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css">
  <title>TM — Turki Manger</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">TM</span><span class="brand-name">TURKI MANGER</span></div>
      <button class="avatar" aria-label="Open profile">T</button>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Main navigation">
      <button class="tab active" data-page="dashboard"><span>⌂</span><small>Home</small></button>
      <button class="tab" data-page="music"><span>♫</span><small>Music</small></button>
      <button class="tab" data-page="projects"><span>▦</span><small>Projects</small></button>
      <button class="tab" data-page="tasks"><span>✓</span><small>Tasks</small></button>
      <button class="tab" data-page="more"><span>•••</span><small>More</small></button>
    </nav>
  </div>
  <script src="/app.js"></script>
</body>
</html>
